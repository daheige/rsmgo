[workspace]
members = [
    "crates/rsmgo-cli",
    "crates/rsmgo-core",
    "crates/rsmgo-pb"
]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["rsmgo contributors"]
license = "Apache-2.0"
repository = "https://github.com/daheige/rsmgo"

[workspace.dependencies]
rsmgo-pb = { path = "crates/rsmgo-pb" }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.13", features = ["json", "stream"] }
async-trait = "0.1.92"
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
tokio-stream = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
dirs = "6.0.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
