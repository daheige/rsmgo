[workspace]
members = [
    "crates/rsmgo-cli",
    "crates/rsmgo-core",
    "crates/rsmgo-pb"
]

resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["daheige", "rsmgo contributors"]
license = "Apache-2.0"
repository = "https://github.com/daheige/rsmgo"

[workspace.dependencies]
rsmgo-pb = { path = "crates/rsmgo-pb" }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.33"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
tokio-stream = "0.1.19"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled", "chrono", "uuid"] }
dirs = "7.0.0"
rmcp = { version = "3.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
http = "1.5.0"
headless_chrome = "1.0.22"
rustyline = "19.0.0"
termimad = "0.35.5"
crossterm = "0.29.0"
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
