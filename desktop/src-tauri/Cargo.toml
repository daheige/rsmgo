[workspace]

[package]
name = "rsmgo-desktop"
version = "0.1.0"
description = "rsmgo desktop application"
authors = ["rsmgo contributors"]
license = "Apache-2.0"
repository = "https://github.com/daheige/rsmgo"
edition = "2021"
rust-version = "1.78"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
